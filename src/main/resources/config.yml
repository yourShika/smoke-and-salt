# ==========================================================================
#  Smoke & Salt - Konfiguration
#  Ein vanilla-treues Koch-System. Diese Datei steuert die Funktionen.
#  Konkrete Zutaten, Rezepte, Gerichte und Seeds werden weiter unten
#  ergaenzt (standardmaessig leer).
# ==========================================================================

# Interne Struktur-Version. NICHT von Hand aendern.
config-version: 2

# HINWEIS: Smoke & Salt bringt Standard-Items, -Seeds und -Rezepte bereits
# eingebaut mit (siehe /sas recipes). Fuer uebersichtliche Erweiterungen werden
# beim ersten Start zusaetzlich Dateien unter plugins/SmokeAndSalt/content/
# angelegt: items.yml, seeds.yml, smoker.yml, campfire.yml,
# water_cauldron.yml, lava_cauldron.yml, cutting.yml und crafting.yml.
# Ein Eintrag in dieser config.yml mit gleicher ID hat Vorrang.

# Sprache der Nachrichten (messages_<lang>.yml). Mitgeliefert: en, de.
language: en

# Zusaetzliche Log-Ausgaben fuer die Fehlersuche.
debug: false

# --------------------------------------------------------------------------
#  Koch-System
# --------------------------------------------------------------------------
cooking:
  enabled: true
  # Globale Schalter fuer Partikel und Sounds aller Stationen.
  particles: true
  sounds: true
  stations:
    smoker: true          # Raeuchern im Smoker-Block
    campfire: true        # Garen ueber dem Lagerfeuer
    cauldron-water: true  # Kochen in kochendem Wasser (Kessel ueber Waermequelle)
    cauldron-lava: true   # Braten/Frittieren im Lavakessel
    cutting: true         # Schneiden mit Axt in einer Hand + Zutat in der anderen
  # Zufaellige Werkzeug-Abnutzung pro Schnitt (inklusive).
  cutting:
    durability-min: 1
    durability-max: 5

# --------------------------------------------------------------------------
#  Drops beim Abbauen von Blaettern (optional, standardmaessig leer)
#  Schema pro Eintrag:
#    <id>:
#      item: <item_id>        # Custom-Item ODER ...
#      material: APPLE        # ... Vanilla-Material
#      chance: 0.05           # 0..1
#      min: 1
#      max: 1
#      leaves: [OAK_LEAVES]   # optionaler Filter; leer = alle Blaetter
# --------------------------------------------------------------------------
leaf-drops:
  enabled: true
  drops: {}

# --------------------------------------------------------------------------
#  Custom Seeds
# --------------------------------------------------------------------------
seeds:
  enabled: true
  # Definitionen der Custom-Seeds. Standardmaessig leer.
  # Schema pro Eintrag:
  #   <seed_id>:
  #     material: WHEAT_SEEDS        # Basis-Optik des Seed-Items
  #     display-name: "<green>Name"  # MiniMessage
  #     provider-id: sas_seed_xyz    # optional: Oraxen-Item-ID fuer Textur
  #     crop-material: WHEAT         # Vanilla-Crop-Block beim Anpflanzen (Ageable)
  #     result-item: <item_id>       # Custom-Item als Ernte (siehe items:)
  #     result-material: WHEAT       # alternativ: Vanilla-Material als Ernte
  #     result-amount: 1
  #     seed-return-min: 0           # min. Samen, die bei der Ernte zurueckkommen
  #     seed-return-max: 0           # max. Samen, die bei der Ernte zurueckkommen
  #     grass-chance: 0.0            # Drop-Chance beim Abbauen von Land-Gras (0..1)
  #     seagrass-chance: 0.0         # Drop-Chance beim Abbauen von Seegras (0..1)
  #     composter-chance: 0.0        # Drop-Chance an einem vollen Komposter (0..1)
  definitions: {}

# --------------------------------------------------------------------------
#  Ketten (Aufhaengung fuer Kessel-Behang / Raeucherware)
# --------------------------------------------------------------------------
chain:
  enabled: true

# --------------------------------------------------------------------------
#  Custom-Items (Zutaten, Werkzeuge, Ergebnisse)
#  Standardmaessig leer. Schema pro Eintrag:
#    <item_id>:
#      material: PAPER
#      display-name: "<gold>Name"    # MiniMessage
#      lore:
#        - "<gray>Zeile 1"
#      provider-id: sas_item_xyz      # optional: Oraxen-Item-ID fuer Textur
#      glow: false
#      food:                          # optional: macht das Item essbar
#        nutrition: 3                 # halbe Hungerkeulen
#        saturation: 3.0              # Saturation-Wert
#        can-always-eat: false
# --------------------------------------------------------------------------
items: {}

# --------------------------------------------------------------------------
#  Koch-Rezepte
#  Standardmaessig leer. Fuer sequentielles (mehrstufiges) Kochen verweist die
#  Zutat einer Stufe einfach auf das Custom-Ergebnis der vorherigen Stufe.
#  Schema pro Eintrag:
#    <recipe_id>:
#      station: SMOKER | CAMPFIRE | CAULDRON_WATER | CAULDRON_LAVA | CUTTING
#      input-item: <item_id>        # Custom-Item als Zutat ...
#      input-material: PORKCHOP     # ... oder Vanilla-Material
#      result-item: <item_id>       # Custom-Item als Ergebnis ...
#      result-material: COOKED_PORKCHOP  # ... oder Vanilla-Material
#      result-amount: 1
#      duration-ticks: 100          # 20 Ticks = 1 Sekunde
# --------------------------------------------------------------------------
recipes: {}

# --------------------------------------------------------------------------
#  Welten-Beschraenkung (optional)
# --------------------------------------------------------------------------
worlds:
  # Ist die Whitelist nicht leer, funktioniert das Plugin NUR in diesen Welten.
  whitelist: []
  # Andernfalls: in allen Welten AUSSER diesen.
  blacklist: []

# --------------------------------------------------------------------------
#  Externe Module (Hooks) - live steuerbar ueber /sas modules
#  Sie aktivieren sich automatisch, sobald das jeweilige Plugin installiert ist.
# --------------------------------------------------------------------------
hooks:
  modules:
    oraxen: true          # Custom-Modelle/Texturen fuer alle Items
    placeholderapi: true  # Platzhalter (%sas_*%)
