# Shapeless crafting-table recipes. Smoke & Salt validates custom ingredients by
# their internal item IDs, so custom foods are not accepted in unrelated recipes.

crafting-recipes:
  burger:
    ingredients:
      - material: BREAD
        display: Bread
      - material: COOKED_BEEF
        display: Meat
    result:
      item: burger
      amount: 1

  cheeseburger:
    ingredients:
      - material: BREAD
        display: Bread
      - item: kaese
        display: Cheese
      - material: COOKED_BEEF
        display: Meat
    result:
      item: cheeseburger
      amount: 1

  sourcream:
