# Cutting recipes. Station defaults to CUTTING in this file.
# Hold an axe in either hand and the ingredient in the other hand, then right-click.
#
# You may define new result items in this same file:
# items:
#   chopped_example:
#     material: PAPER
#     display-name: "<yellow>Chopped Example"
#     provider-id: sas_chopped_example
#     food:
#       nutrition: 2
#       saturation: 1.2

recipes:
  cutting_chicken_nuggets:
    input-material: COOKED_CHICKEN
    result-item: chicken_nuggets
    # Random yield between min and max (inclusive).
    result-amount-min: 1
    result-amount-max: 4
    duration-ticks: 60

  # --- 0.9.0 ---
  cutting_apfelscheiben:
    input-material: APPLE
    result-item: apfelscheiben
    result-amount-min: 2
    result-amount-max: 3
    duration-ticks: 50

  cutting_ananasslice:
    input-item: pineapple
    result-item: ananasslice
    result-amount-min: 2
    result-amount-max: 3
    duration-ticks: 50

  cutting_steakstreifen:
    input-material: COOKED_BEEF
    result-item: steakstreifen
    result-amount-min: 2
    result-amount-max: 3
    duration-ticks: 60
