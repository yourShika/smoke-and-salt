# Water cauldron recipes. Ingredients are unordered and are dropped into a
# boiling water cauldron above a heat source.

cauldron-recipes:
  cauldron_teig:
    ingredients:
      - material: WHEAT
        display: Wheat
      - material: WHEAT
        display: Wheat
      - material: WHEAT
        display: Wheat
    result:
      item: teig
      amount: 1
    duration-ticks: 120
    water-cost: 1

  cauldron_nudeln:
    ingredients:
      - item: teig
        display: Dough
    result:
      item: nudeln
      amount: 1
    duration-ticks: 200

